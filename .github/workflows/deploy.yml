name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

# AUDIT 1d-W4: least privilege. The build job only reads the repo; only the
# deploy job gets Pages write + the OIDC token it needs.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (AUDIT W-05: pinned to a commit)

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (AUDIT W-05: pinned to a commit)
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5 (AUDIT W-05: pinned to a commit)

      - name: Install dependencies
        run: npm ci

      - name: Setup Python for Live Telemetry
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (AUDIT W-05: pinned to a commit)
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Fetch Live Server Telemetry
        run: python scripts/fetch_live_servers.py
        continue-on-error: true

      - name: Refresh mapper names for new maps (best effort)
        run: python scripts/refresh_map_mappers.py
        continue-on-error: true

      - name: Build site with Vite
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3 (AUDIT W-05: pinned to a commit)
        with:
          path: ./dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4 (AUDIT W-05: pinned to a commit)
        with:
          timeout: 600000
