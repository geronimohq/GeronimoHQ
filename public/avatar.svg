<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1830" />
      <stop offset="50%" stop-color="#060913" />
      <stop offset="100%" stop-color="#030408" />
    </radialGradient>

    <!-- Neon Glow Filters -->
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonMagenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pepe Colors -->
    <linearGradient id="pepePartySkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ce03a" />
      <stop offset="60%" stop-color="#6ec228" />
      <stop offset="100%" stop-color="#498a14" />
    </linearGradient>

    <linearGradient id="neonVisor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <linearGradient id="neonHeadphones" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" fill="url(#bgGlow)" />

  <!-- Subtle Perspective Wireframe Lines -->
  <g opacity="0.25" stroke="#00f0ff" stroke-width="1.2">
    <line x1="256" y1="280" x2="30" y2="512" />
    <line x1="256" y1="280" x2="110" y2="512" />
    <line x1="256" y1="280" x2="190" y2="512" />
    <line x1="256" y1="280" x2="256" y2="512" />
    <line x1="256" y1="280" x2="322" y2="512" />
    <line x1="256" y1="280" x2="402" y2="512" />
    <line x1="256" y1="280" x2="482" y2="512" />
    <line x1="0" y1="380" x2="512" y2="380" />
    <line x1="0" y1="430" x2="512" y2="430" />
    <line x1="0" y1="475" x2="512" y2="475" />
  </g>

  <!-- Circular HUD Targeting Ring (Matches Gmail's Circular Crop) -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#00f0ff" stroke-width="3" opacity="0.6" filter="url(#neonCyan)" />
  <circle cx="256" cy="256" r="248" fill="none" stroke="#ff007f" stroke-width="1.5" stroke-dasharray="16 12" opacity="0.7" filter="url(#neonMagenta)" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="#39ff14" stroke-width="1" stroke-dasharray="4 8" opacity="0.4" />

  <!-- Corner Tech Accent Marks -->
  <path d="M 256 12 L 256 24" stroke="#00f0ff" stroke-width="3" />
  <path d="M 256 488 L 256 500" stroke="#00f0ff" stroke-width="3" />
  <path d="M 12 256 L 24 256" stroke="#00f0ff" stroke-width="3" />
  <path d="M 488 256 L 500 256" stroke="#00f0ff" stroke-width="3" />

  <!-- Center Character Scale Group -->
  <g transform="translate(16, 28) scale(2)">
    
    <!-- Party Vibe Shirt with Cyber Matrix Pattern -->
    <path
      d="M25 200 C45 175 75 168 120 168 C165 168 195 175 215 200 L230 240 L10 240 Z"
      fill="#091422"
      stroke="#39ff14"
      stroke-width="2"
      stroke-opacity="0.5"
    />
    <!-- Cyber Equalizer lines on shirt -->
    <path d="M90 205 L90 190" stroke="#39ff14" stroke-width="3" stroke-linecap="round" />
    <path d="M100 208 L100 182" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" />
    <path d="M110 210 L110 176" stroke="#ff007f" stroke-width="3" stroke-linecap="round" />
    <path d="M120 212 L120 172" stroke="#ffe600" stroke-width="3" stroke-linecap="round" />
    <path d="M130 210 L130 178" stroke="#ff007f" stroke-width="3" stroke-linecap="round" />
    <path d="M140 208 L140 184" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" />
    <path d="M150 205 L150 192" stroke="#39ff14" stroke-width="3" stroke-linecap="round" />

    <!-- DJ Headphones Band Over Head -->
    <path
      d="M40 92 C38 30 202 30 200 92"
      fill="none"
      stroke="url(#neonHeadphones)"
      stroke-width="9"
      stroke-linecap="round"
    />
    <path
      d="M50 82 C50 40 190 40 190 82"
      fill="none"
      stroke="#00f0ff"
      stroke-width="2"
      stroke-opacity="0.8"
    />

    <!-- Pepe Head Outline -->
    <path
      d="M48 130 C36 110 38 80 46 64 C58 42 90 38 120 38 C158 38 190 46 196 70 C204 94 200 120 184 136 C174 148 158 156 130 158 C92 160 62 148 48 130 Z"
      fill="url(#pepePartySkin)"
      stroke="#1b3809"
      stroke-width="4.5"
      stroke-linejoin="round"
    />

    <!-- DJ Headphone Earcups with Pulsing RGB Ring -->
    <g>
      <rect x="24" y="80" width="22" height="36" rx="8" fill="#0f172a" stroke="#00f0ff" stroke-width="3" />
      <circle cx="35" cy="98" r="6" fill="#39ff14" />
    </g>
    <g>
      <rect x="194" y="80" width="22" height="36" rx="8" fill="#0f172a" stroke="#00f0ff" stroke-width="3" />
      <circle cx="205" cy="98" r="6" fill="#39ff14" />
    </g>

    <!-- CYBERPUNK NEON VISOR SUNGLASSES -->
    <g>
      <!-- Dark Visor Base -->
      <path
        d="M45 74 C75 64 165 64 195 74 L190 102 C155 110 85 110 50 102 Z"
        fill="#060913"
        stroke="#00f0ff"
        stroke-width="2.5"
      />
      <!-- Glowing Neon Visor Mirror Strip -->
      <path
        d="M50 78 C76 70 164 70 190 78 L186 96 C152 104 88 104 54 96 Z"
        fill="url(#neonVisor)"
        opacity="0.95"
      />
      <!-- Cyber Visor HUD Scan Lines -->
      <line x1="58" y1="86" x2="182" y2="86" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.7" />
      <circle cx="70" cy="86" r="2" fill="#ffffff" />
      <circle cx="170" cy="86" r="2" fill="#ffffff" />
    </g>

    <!-- Cheerful Nostrils -->
    <ellipse cx="108" cy="118" rx="3.5" ry="4" fill="#1b3809" />
    <ellipse cx="128" cy="118" rx="3.5" ry="4" fill="#1b3809" />

    <!-- Cool Smirking Vibing Mouth -->
    <g>
      <path
        d="M68 136 C88 132 140 130 172 136 C168 152 138 160 114 158 C88 156 72 148 68 136 Z"
        fill="#2e5414"
        stroke="#1b3809"
        stroke-width="4"
      />
      <path
        d="M66 136 Q118 130 174 136"
        fill="none"
        stroke="#1b3809"
        stroke-width="4.5"
        stroke-linecap="round"
      />
    </g>

    <!-- Glowing Neon Glowsticks -->
    <line x1="18" y1="100" x2="32" y2="135" stroke="#39ff14" stroke-width="6" stroke-linecap="round" />
    <line x1="222" y1="100" x2="208" y2="135" stroke="#ff007f" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Bottom Brand Ribbon (Curved inside the circle) -->
  <g transform="translate(256, 460)">
    <rect x="-110" y="-18" width="220" height="28" rx="6" fill="#060a16" stroke="#00f0ff" stroke-width="2" filter="url(#neonCyan)" />
    <text x="0" y="2" font-family="'Orbitron', sans-serif" font-weight="900" font-size="14" fill="#00f0ff" text-anchor="middle" letter-spacing="3">
      GERONIMO HQ
    </text>
  </g>
</svg>
