<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <radialGradient id="radar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="320" height="180" fill="url(#bg)" />
  <rect width="320" height="180" fill="url(#grid)" />
  <circle cx="160" cy="80" r="60" fill="url(#radar-glow)" />

  <!-- Radar Crosshairs & Circles -->
  <circle cx="160" cy="80" r="50" fill="none" stroke="#0891b2" stroke-width="1" stroke-dasharray="3,3" opacity="0.4" />
  <circle cx="160" cy="80" r="32" fill="none" stroke="#06b6d4" stroke-width="1.2" opacity="0.6" />
  <circle cx="160" cy="80" r="14" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.8" />
  <line x1="160" y1="20" x2="160" y2="140" stroke="#0891b2" stroke-width="1" opacity="0.3" />
  <line x1="100" y1="80" x2="220" y2="80" stroke="#0891b2" stroke-width="1" opacity="0.3" />

  <!-- Center Blip -->
  <circle cx="160" cy="80" r="3" fill="#a855f7" />
  <circle cx="180" cy="65" r="2.5" fill="#22c55e" />
  <circle cx="145" cy="95" r="2" fill="#ef4444" />

  <!-- Top Badge -->
  <rect x="10" y="10" width="84" height="16" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="52" y="21" fill="#94a3b8" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="1">MAP INTEL</text>

  <!-- Title Bottom -->
  <text x="160" y="156" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1.5">TACTICAL RADAR</text>
  <text x="160" y="168" fill="#64748b" font-family="monospace" font-size="8" text-anchor="middle">LIVE SATELLITE FEED PENDING</text>
</svg>
