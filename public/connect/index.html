<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeronimoHQ // CS2 Steam Connect</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #060913;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      overflow-x: hidden;
    }
    .container {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(0, 255, 204, 0.3);
      border-radius: 16px;
      padding: 36px 28px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 40px rgba(0, 255, 204, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      position: relative;
    }
    .container.error-state {
      border-color: rgba(239, 68, 68, 0.5);
      box-shadow: 0 0 40px rgba(239, 68, 68, 0.2);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 255, 204, 0.1);
      border: 1px solid rgba(0, 255, 204, 0.4);
      color: #00ffcc;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 20px;
    }
    .badge.error-badge {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.5);
      color: #f87171;
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      background: #00ffcc;
      border-radius: 50%;
      box-shadow: 0 0 8px #00ffcc;
      animation: pulse 1.8s infinite;
    }
    .pulse-dot.error-dot {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      animation: none;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    p.sub {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .ip-box {
      background: #0a0e1a;
      border: 1px dashed rgba(245, 158, 11, 0.4);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .ip-box.ip-box-error {
      border-color: rgba(239, 68, 68, 0.6);
      background: rgba(127, 29, 29, 0.15);
    }
    .ip-box span.label {
      color: #94a3b8;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .ip-box span.ip {
      color: #fbbf24;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .ip-box span.ip.ip-error {
      color: #f87171;
      font-size: 15px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #00ffcc 0%, #00b4d8 100%);
      color: #060913;
      text-decoration: none;
      font-weight: 800;
      font-size: 15px;
      padding: 14px 20px;
      border-radius: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 18px rgba(0, 255, 204, 0.35);
      border: none;
      cursor: pointer;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(0, 255, 204, 0.5);
    }
    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #1e293b;
      color: #cbd5e1;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
      padding: 11px 18px;
      border-radius: 10px;
      border: 1px solid #334155;
      transition: all 0.15s ease;
      cursor: pointer;
    }
    .btn-secondary:hover {
      background: #334155;
      color: #ffffff;
    }
    .footer-note {
      margin-top: 28px;
      font-size: 11px;
      color: #64748b;
    }
    .footer-note a {
      color: #00ffcc;
      text-decoration: none;
    }
    .footer-note a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="main-container" class="container">
    <div id="badge-el" class="badge">
      <span id="dot-el" class="pulse-dot"></span>
      <span id="badge-text">Steam Connect Protocol</span>
    </div>
    <h1 id="title-el">Connecting to CS2 Server</h1>
    <p id="sub-el" class="sub">Launching Counter-Strike 2 via Steam protocol...</p>
    
    <div id="ip-box-el" class="ip-box">
      <span id="target-label" class="label">Target:</span>
      <span id="ip-text" class="ip">Verifying address...</span>
    </div>

    <div class="actions">
      <a id="connect-link" href="#" class="btn-primary">
        🎮 Launch CS2 & Connect Now
      </a>
      <button id="copy-btn" class="btn-secondary" onclick="copyConsoleCommand()">
        📋 Copy Console Command (`connect IP`)
      </button>
      <a href="/" class="btn-secondary">
        🌐 Back to GeronimoHQ.com
      </a>
    </div>

    <div class="footer-note">
      Powered by <a href="/">GeronimoHQ</a> • CS2 Command Center
    </div>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var rawIp = (params.get('ip') || params.get('server') || params.get('host') || window.location.hash.replace('#', '') || '').trim();

      var domainMap = {
        'rsscs2.kr': '14.5.33.30:27015',
        'rsscs2.kr:27015': '14.5.33.30:27015'
      };

      if (rawIp && Object.prototype.hasOwnProperty.call(domainMap, rawIp)) {
        rawIp = domainMap[rawIp];
      }

      function validateTarget(input) {
        if (!input || typeof input !== 'string') {
          return { valid: false, error: 'Invalid server address' };
        }
        var cleaned = input.trim();
        if (!cleaned) {
          return { valid: false, error: 'Invalid server address' };
        }

        var IPV4_PATTERN = '(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(?:\\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)){3}';
        var FQDN_PATTERN = '[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*\\.[a-zA-Z]{2,}';

        var HOST_WITH_PORT_REGEX = new RegExp('^(' + IPV4_PATTERN + '|' + FQDN_PATTERN + '):(\\d+)$');
        var HOST_ONLY_REGEX = new RegExp('^(' + IPV4_PATTERN + '|' + FQDN_PATTERN + ')$');

        var matchWithPort = cleaned.match(HOST_WITH_PORT_REGEX);
        if (matchWithPort) {
          var host = matchWithPort[1];
          var port = parseInt(matchWithPort[2], 10);
          if (port >= 1 && port <= 65535) {
            return { valid: true, target: host + ':' + port };
          } else {
            return { valid: false, error: 'Invalid server address (port must be 1-65535)' };
          }
        }

        var matchHostOnly = cleaned.match(HOST_ONLY_REGEX);
        if (matchHostOnly) {
          var hostOnly = matchHostOnly[1];
          return { valid: true, target: hostOnly + ':27015' };
        }

        return { valid: false, error: 'Invalid server address' };
      }

      var validation = validateTarget(rawIp);

      var ipTextEl = document.getElementById('ip-text');
      var titleEl = document.getElementById('title-el');
      var subEl = document.getElementById('sub-el');
      var connectLinkEl = document.getElementById('connect-link');
      var copyBtnEl = document.getElementById('copy-btn');
      var containerEl = document.getElementById('main-container');
      var badgeEl = document.getElementById('badge-el');
      var dotEl = document.getElementById('dot-el');
      var badgeTextEl = document.getElementById('badge-text');
      var ipBoxEl = document.getElementById('ip-box-el');

      if (!validation.valid) {
        // Render Error State: Zero Steam Launch, No Fallback to Default
        containerEl.className = 'container error-state';
        badgeEl.className = 'badge error-badge';
        dotEl.className = 'pulse-dot error-dot';
        badgeTextEl.textContent = 'Connection Blocked';
        titleEl.textContent = 'Invalid Server Address';
        subEl.textContent = 'The specified server target is invalid or malformed. Launching Counter-Strike 2 has been blocked for your safety.';
        ipBoxEl.className = 'ip-box ip-box-error';
        ipTextEl.className = 'ip ip-error';
        ipTextEl.textContent = 'Invalid server address';

        connectLinkEl.style.display = 'none';
        copyBtnEl.style.display = 'none';
        return;
      }

      // Valid State: Show Target, Build Steam Link Without encodeURIComponent, and Connect
      var targetIp = validation.target;
      ipTextEl.textContent = targetIp;

      var steamUri = 'steam://connect/' + targetIp;
      connectLinkEl.href = steamUri;

      try {
        window.location.href = steamUri;
      } catch (e) {}

      window.copyConsoleCommand = function() {
        var cmd = 'connect ' + targetIp;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(cmd);
        } else {
          var ta = document.createElement('textarea');
          ta.value = cmd;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        var btn = document.getElementById('copy-btn');
        if (btn) {
          btn.textContent = '✓ Copied to Clipboard (`connect ' + targetIp + '`)';
          setTimeout(function() {
            btn.textContent = '📋 Copy Console Command (`connect IP`)';
          }, 2200);
        }
      };
    })();
  </script>
</body>
</html>
